name: release

# `bun pm version patch` (or minor / major) bumps package.json and makes a vX.Y.Z commit and tag;
# `git push --follow-tags` then lands here and publishes a GitHub Release for that tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Tag must match package.json
        run: |
          want="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $want"
            exit 1
          fi
      - name: Test
        run: bun test
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
